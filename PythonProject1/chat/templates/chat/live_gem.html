<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GeM Integration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f9f9f9;
        }
        .section h2 {
            color: #555;
            margin-top: 0;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .chat-history {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            background: white;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }
        .user-message {
            background: #e3f2fd;
            text-align: right;
        }
        .bot-message {
            background: #f1f8e9;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Live GeM Integration</h1>
        
        <!-- PDF Extraction Section -->
        <div class="section">
            <h2>📄 Extract GeM PDF</h2>
            <input type="text" id="bidId" placeholder="Enter 7-digit Bid ID (e.g., 8246762)" maxlength="7">
            <button onclick="extractPDF()" id="extractBtn">Extract PDF</button>
            <div class="loading" id="extractLoading">🔄 Downloading and processing PDF...</div>
            <div id="extractResult"></div>
        </div>
        
        <!-- Chat Section -->
        <div class="section">
            <h2>💬 Chat with Extracted Data</h2>
            <input type="text" id="question" placeholder="Ask about the extracted PDF (e.g., 'What is the item category?')">
            <button onclick="askQuestion()" id="chatBtn">Ask Question</button>
            <div class="loading" id="chatLoading">🤔 Searching and generating answer...</div>
            <div class="chat-history" id="chatHistory"></div>
        </div>
    </div>

    <script>
        async function extractPDF() {
            const bidId = document.getElementById('bidId').value.trim();
            const extractBtn = document.getElementById('extractBtn');
            const extractLoading = document.getElementById('extractLoading');
            const extractResult = document.getElementById('extractResult');
            
            if (!bidId || bidId.length !== 7 || !/^\d+$/.test(bidId)) {
                extractResult.innerHTML = '<div class="result error">Please enter a valid 7-digit bid ID</div>';
                return;
            }
            
            extractBtn.disabled = true;
            extractLoading.style.display = 'block';
            extractResult.innerHTML = '';
            
            try {
                const response = await fetch('/chat/live-gem-extract/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ bid_id: bidId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    extractResult.innerHTML = `<div class="result success">✅ ${data.message}\n📊 Created ${data.chunks} chunks</div>`;
                    // Clear chat history for new PDF
                    document.getElementById('chatHistory').innerHTML = '';
                } else {
                    extractResult.innerHTML = `<div class="result error">❌ ${data.error}</div>`;
                }
            } catch (error) {
                extractResult.innerHTML = `<div class="result error">❌ Network error: ${error.message}</div>`;
            } finally {
                extractBtn.disabled = false;
                extractLoading.style.display = 'none';
            }
        }
        
        async function askQuestion() {
            const question = document.getElementById('question').value.trim();
            const chatBtn = document.getElementById('chatBtn');
            const chatLoading = document.getElementById('chatLoading');
            const chatHistory = document.getElementById('chatHistory');
            
            if (!question) {
                return;
            }
            
            // Add user message
            chatHistory.innerHTML += `<div class="message user-message"><strong>You:</strong> ${question}</div>`;
            
            chatBtn.disabled = true;
            chatLoading.style.display = 'block';
            document.getElementById('question').value = '';
            
            try {
                const response = await fetch('/chat/live-gem-chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                if (data.answer) {
                    chatHistory.innerHTML += `<div class="message bot-message"><strong>Bot:</strong> ${data.answer}<br><small>📄 Used ${data.chunks_used} chunks</small></div>`;
                } else {
                    chatHistory.innerHTML += `<div class="message bot-message error"><strong>Error:</strong> ${data.error}</div>`;
                }
                
                // Scroll to bottom
                chatHistory.scrollTop = chatHistory.scrollHeight;
                
            } catch (error) {
                chatHistory.innerHTML += `<div class="message bot-message error"><strong>Network Error:</strong> ${error.message}</div>`;
            } finally {
                chatBtn.disabled = false;
                chatLoading.style.display = 'none';
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('bidId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                extractPDF();
            }
        });
        
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });
    </script>
</body>
</html>
